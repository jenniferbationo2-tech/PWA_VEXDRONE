# Equivalent Amplify Hosting du bloc [[headers]] de netlify.toml (garde en
# parallele pendant la transition Netlify -> AWS Amplify, voir ce fichier
# pour le detail de chaque source CSP). Amplify Hosting lit ce fichier a la
# racine du repo automatiquement, aucune config console requise pour les
# headers.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self'; connect-src 'self' https://vexdrone-osc.onrender.com wss://vexdrone-osc.onrender.com https://api.open-meteo.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com stun:stun.l.google.com:19302 https://*.sentry.io; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
